[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast-dk"
version = "0.2.0"
description = "Predict electricity consumption (MW) in Denmark using hourly time-series data."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "holidays",
    "scikit-learn==1.6.1",
    "joblib",
    "minio",
    "mlflow",
]

[project.optional-dependencies]
deep-learning = ["tensorflow"]
prefect = ["prefect"]
airflow = ["apache-airflow"]
serving = ["fastapi", "uvicorn", "prometheus-client"]
feast = ["feast"]
all = [
    "tensorflow",
    "apache-airflow",
    "fastapi",
    "uvicorn",
    "prometheus-client",
    "feast",
]

[tool.setuptools.packages.find]
where = ["src"]
