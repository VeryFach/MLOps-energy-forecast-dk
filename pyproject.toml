[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast-dk"
version = "0.2.0"
description = "Predict electricity consumption (MW) in Denmark using hourly time-series data."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "holidays",
    "scikit-learn==1.6.1",
    "joblib",
    "minio",
    "mlflow",
]

[project.optional-dependencies]
report = ["Pillow"]
deep-learning = ["tensorflow"]
prefect = ["prefect"]
airflow = ["apache-airflow"]
serving = [
    "fastapi", "uvicorn", "prometheus-client",
    "mlflow==3.17.2", "numpy==2.4.6", "pandas==3.0.5",
    "psutil==7.0.0", "scipy==1.15.1", "skops==0.14.0",
]
feast = ["feast"]
all = [
    "tensorflow",
    "apache-airflow",
    "fastapi",
    "uvicorn",
    "prometheus-client",
    "feast",
]

[tool.setuptools.packages.find]
where = ["src"]
