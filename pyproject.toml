[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast-dk"
version = "0.1.0"
description = "Predict electricity consumption (MW) in Denmark using hourly time-series data."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "holidays",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
deep-learning = ["tensorflow"]
prefect = ["prefect"]

[tool.setuptools.packages.find]
where = ["src"]