services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PROJECT_ROOT=/app
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=energy-forecast
    depends_on:
      - mlflow
      - minio
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert h['status']=='healthy' and h['model_loaded']"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"

  ingestion:
    build: .
    command: ["python", "-m", "energy_forecast.orchestration.continuous_ingestion"]
    environment:
      - PROJECT_ROOT=/app
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=energy-forecast
      - INGESTION_INTERVAL_MINUTES=${INGESTION_INTERVAL_MINUTES:-5}
      - INGESTION_MAX_ATTEMPTS=${INGESTION_MAX_ATTEMPTS:-3}
      - INGESTION_RETRY_DELAY_SECONDS=${INGESTION_RETRY_DELAY_SECONDS:-60}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "python", "-m", "energy_forecast.orchestration.healthcheck", "--file", "/app/logs/ingestion.heartbeat", "--max-age-seconds", "900"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  daily-retraining:
    build: .
    command: ["python", "-m", "energy_forecast.orchestration.daily_retraining"]
    environment:
      - PROJECT_ROOT=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=energy-forecast
      - RETRAINING_MAPE_THRESHOLD=${RETRAINING_MAPE_THRESHOLD:-5.0}
      - DAILY_RETRAINING_HOUR=${DAILY_RETRAINING_HOUR:-1}
      - DAILY_RETRAINING_MINUTE=${DAILY_RETRAINING_MINUTE:-0}
      - DAILY_RETRAINING_RUN_ON_START=${DAILY_RETRAINING_RUN_ON_START:-false}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    depends_on:
      - mlflow
      - minio
    healthcheck:
      test: ["CMD", "python", "-m", "energy_forecast.orchestration.healthcheck", "--file", "/app/logs/daily-retraining.heartbeat", "--max-age-seconds", "3600"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --serve-artifacts --default-artifact-root mlflow-artifacts:/ --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlflow-data:
  minio-data:
  prometheus-data:
  grafana-data:
